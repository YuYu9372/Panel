[package]
name = "panel-bootstrap"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["pem", "pkcs8"] }
hex = "0.4"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
ed25519-dalek = { version = "2.2", features = ["pem", "pkcs8", "rand_core"] }
tempfile = "3.23"
